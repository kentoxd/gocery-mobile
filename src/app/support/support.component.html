<div class="page">
  <h1>Help & Support</h1>

  <h2>FAQs</h2>
  @for (f of faqs; track f.q) {
    <details class="card faq">
      <summary>{{ f.q }}</summary>
      <p class="muted">{{ f.a }}</p>
    </details>
  }

  <h2 style="margin-top:1.5rem">Contact Us</h2>
  @if (submitted()) {
    <div class="card success">Thanks! We've received your message and will get back to you soon.</div>
  } @else {
    <div class="card">
      <div class="form-group"><label>Name</label><input [(ngModel)]="name"></div>
      <div class="form-group"><label>Email</label><input type="email" [(ngModel)]="email"></div>
      <div class="form-group"><label>Message</label><textarea [(ngModel)]="message" rows="4"></textarea></div>
      @if (error()) { <p class="form-error">{{ error() }}</p> }
      <button class="btn btn--primary" (click)="submit()" [disabled]="submitting()">
        {{ submitting() ? 'Sending…' : 'Send Message' }}
      </button>
    </div>
  }
</div>
