<div class="page">
  <h1>My Orders</h1>
  @if (loading()) {
    <p class="muted">Loading…</p>
  } @else if (!orders().length) {
    <p class="muted">No orders yet.</p>
  } @else {
    @for (o of orders(); track o.id) {
      <a [routerLink]="['/orders', o.id]" class="card order-row">
        <div>
          <strong>Order {{ o.id.slice(0, 8) }}</strong>
          <p class="muted">{{ o.items.length }} item(s) — ₱{{ o.total.toFixed(2) }}</p>
        </div>
        <span class="status status--{{ o.status.replace(' ', '-') }}">{{ o.status }}</span>
      </a>
    }
  }
</div>
