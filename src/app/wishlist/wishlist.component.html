<div class="page">
  <h1>My Wishlist</h1>
  @if (loading()) {
    <p class="muted">Loading…</p>
  } @else if (!products().length) {
    <div class="empty">
      <p>Your wishlist is empty.</p>
      <a routerLink="/shop" class="btn btn--primary">Browse Products</a>
    </div>
  } @else {
    @for (p of products(); track p.id) {
      <div class="card wishlist-item">
        <div class="wishlist-item__image">
          @if (p.imageUrl) { <img [src]="p.imageUrl" [alt]="p.name"> } @else { <span>{{ p.image }}</span> }
        </div>
        <div class="wishlist-item__info">
          <strong>{{ p.name }}</strong>
          <span class="muted">₱{{ p.variants[0].price.toFixed(2) }}</span>
          <div class="actions">
            <button class="btn btn--primary" (click)="moveToCart(p)">Add to Cart</button>
            <button class="btn btn--outline" (click)="remove(p.id)">Remove</button>
          </div>
        </div>
      </div>
    }
  }
</div>
