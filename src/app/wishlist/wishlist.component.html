<div class="page">
  <div class="page-header">
    <h1>My Wishlist</h1>
  </div>

  @if (loading()) {
    <p class="muted">Loading…</p>
  } @else if (!products().length) {
    <div class="empty-state">
      <span class="empty-state__icon">🤍</span>
      <p>Your wishlist is empty.</p>
      <a routerLink="/shop" class="btn btn--primary">Browse Products</a>
    </div>
  } @else {
    @for (p of products(); track p.id) {
      <div class="card wishlist-item">
        <div class="wishlist-item__image">
          @if (p.imageUrl) { <img [src]="p.imageUrl" [alt]="p.name" loading="lazy"> } @else { <span>{{ p.image }}</span> }
        </div>
        <div class="wishlist-item__info">
          <strong>{{ p.name }}</strong>
          <span class="price">₱{{ p.variants[0].price.toFixed(2) }}</span>
          <div class="actions">
            <button class="btn btn--primary btn--sm" (click)="moveToCart(p)">Add to Cart</button>
            <button class="btn btn--outline btn--sm" (click)="remove(p.id)">Remove</button>
          </div>
        </div>
      </div>
    }
  }
</div>
