<div class="page auth-page">
  <h1>Create Your Account</h1>
  <p class="muted">Join Go! Cery for palengke-fresh delivery</p>

  <form (ngSubmit)="submit()" class="card">
    <div class="form-group"><label>Full Name</label><input [(ngModel)]="name" name="name" required></div>
    <div class="form-group"><label>Email</label><input type="email" [(ngModel)]="email" name="email" required></div>
    <div class="form-group"><label>Phone</label><input [(ngModel)]="phone" name="phone"></div>
    <div class="form-group"><label>Password</label><input type="password" [(ngModel)]="password" name="password" required></div>
    @if (error()) { <p class="form-error">{{ error() }}</p> }
    <button class="btn btn--primary" type="submit" [disabled]="loading()">
      {{ loading() ? 'Creating account…' : 'Register' }}
    </button>
  </form>

  <p class="switch">Already have an account? <a routerLink="/login">Login</a></p>
</div>
