<div class="page auth-page">
  <img class="auth-logo-img" src="https://res.cloudinary.com/m0uovtom/image/upload/f_auto,q_auto/v1787825182/GOCERY_LOGO.png" width="80" height="68" alt="Go! Cery">

  @if (step() === 'register') {
    <h1>Create Your Account</h1>
    <p class="muted">Join Go! Cery for palengke-fresh delivery</p>

    <form (ngSubmit)="submit()" class="card">
      <div class="form-group"><label>Full Name</label><input [(ngModel)]="name" name="name" required></div>
      <div class="form-group"><label>Email</label><input type="email" [(ngModel)]="email" name="email" required></div>
      <div class="form-group"><label>Phone</label><input [(ngModel)]="phone" name="phone"></div>
      <div class="form-group"><label>Password</label><input type="password" [(ngModel)]="password" name="password" required></div>
      <div class="form-group"><label>Confirm Password</label><input type="password" [(ngModel)]="confirmPassword" name="confirmPassword" required></div>
      @if (error()) { <p class="form-error">{{ error() }}</p> }
      <button class="btn btn--primary" type="submit" [disabled]="loading()">
        {{ loading() ? 'Sending code…' : 'Register' }}
      </button>
    </form>

    <p class="switch">Already have an account? <a routerLink="/login">Login</a></p>
  } @else {
    <h1>Verify Your Email</h1>
    <p class="muted">We sent a 6-digit code to <strong>{{ pendingEmail() }}</strong></p>

    <form (ngSubmit)="confirmOtp()" class="card">
      <div class="form-group">
        <label>Verification Code</label>
        <input [(ngModel)]="otp" name="otp" inputmode="numeric" maxlength="6" placeholder="000000" required>
      </div>
      @if (otpError()) { <p class="form-error">{{ otpError() }}</p> }
      <button class="btn btn--primary" type="submit" [disabled]="otpLoading()">
        {{ otpLoading() ? 'Creating account…' : 'Verify & Create Account' }}
      </button>
    </form>

    <div class="otp-actions">
      <button class="btn btn--outline btn--sm" (click)="resendOtp()" [disabled]="resending()">
        {{ resending() ? 'Resending…' : 'Resend Code' }}
      </button>
      <button class="btn btn--outline btn--sm" (click)="backToRegister()">Back</button>
    </div>
  }
</div>
