<div class="page auth-page">
  <h1>Welcome Back, Suki!</h1>
  <p class="muted">Login to your Go! Cery account</p>

  <form (ngSubmit)="submit()" class="card">
    <div class="form-group">
      <label>Email</label>
      <input type="email" [(ngModel)]="email" name="email" required placeholder="you@email.com">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" [(ngModel)]="password" name="password" required placeholder="Your password">
    </div>
    @if (error()) { <p class="form-error">{{ error() }}</p> }
    <button class="btn btn--primary" type="submit" [disabled]="loading()">
      {{ loading() ? 'Logging in…' : 'Login' }}
    </button>
  </form>

  <button class="btn btn--outline" style="margin-top:0.75rem" (click)="googleLogin()">Continue with Google</button>
  <p class="switch">Don't have an account? <a routerLink="/register">Register</a></p>
</div>
