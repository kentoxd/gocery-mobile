<div class="page-header">
  @if (showBack) {
    <button type="button" class="page-header__back" (click)="goBack()" aria-label="Back">←</button>
  } @else {
    <button type="button" class="page-header__menu" (click)="openMenu()" aria-label="Open menu">☰ Menu</button>
  }
  <h1>{{ title }}</h1>
  <div class="page-header__actions">
    @if (showBack) {
      <button type="button" class="page-header__menu page-header__menu--icon" (click)="openMenu()" aria-label="Open menu">☰</button>
    }
    @if (showNotif) {
      <app-notif-bell></app-notif-bell>
    }
  </div>
</div>

@if (menuOpen()) {
  <div class="side-menu-overlay" (click)="closeMenu()">
    <nav class="side-menu-panel" (click)="$event.stopPropagation()">
      <a routerLink="/home" (click)="closeMenu()">🏠 Home</a>
      <a routerLink="/cart" routerLinkActive="active" class="side-menu-cart">
        <span>🛒</span> Cart
        @if (cart.itemCount() > 0) {
          <span class="badge">{{ cart.itemCount() }}</span>
        }
      </a>
      <a routerLink="/shop" (click)="closeMenu()">🛍️ Shop</a>
      <a routerLink="/orders" (click)="closeMenu()">📦 My Orders</a>
      <a routerLink="/wishlist" (click)="closeMenu()">❤️ Wishlist</a>
      <a routerLink="/notifications" (click)="closeMenu()">🔔 Notifications</a>
      <a routerLink="/profile" (click)="closeMenu()">👤 Profile</a>
      <a routerLink="/support" (click)="closeMenu()">💬 Support</a>
      <a routerLink="/about" (click)="closeMenu()">ℹ️ About Us</a>
      <button type="button" class="side-menu-close" (click)="closeMenu()">Close</button>
    </nav>
  </div>
}
